<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品質系統文件管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>品質系統文件管理</h1>
  </header>

  <main>
    <!-- 版本總覽表（全寬）-->
    <section id="version-overview">
      <h2>文件版本總覽</h2>
      <div class="table-wrap">
        <table id="version-table">
          <thead>
            <tr>
              <th>文件編號</th>
              <th>文件名稱</th>
              <th>目前版本</th>
              <th>最後更新</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="grid">

      <section id="recent-docs">
        <h2>近期更新文件</h2>
        <ul></ul>
      </section>

      <section id="audit-issues">
        <h2>稽核缺失修改</h2>
        <ul></ul>
      </section>

      <section id="version-diff">
        <h2>版本更新差異</h2>
        <ul></ul>
      </section>

      <section id="quiz">
        <h2>考題</h2>
        <ul></ul>
      </section>

    </div>
  </main>

  <!-- ===== 製修訂表單 Modal ===== -->
  <div id="rev-overlay" role="dialog" aria-modal="true" aria-label="製修訂表單" aria-hidden="true">
    <div id="rev-modal">
      <div id="rev-modal-header">
        <span>製修訂申請表</span>
        <button id="rev-close" aria-label="關閉">&#10005;</button>
      </div>
      <div id="rev-modal-body">

        <!-- 表單 -->
        <div id="rev-form">
          <div class="rev-row">
            <label>文件編號</label>
            <input type="text" id="rev-doc-id" readonly>
          </div>
          <div class="rev-row">
            <label>文件名稱</label>
            <input type="text" id="rev-doc-name" readonly>
          </div>
          <div class="rev-row">
            <label>現行版次</label>
            <input type="text" id="rev-old-ver" readonly>
          </div>
          <div class="rev-row">
            <label>修訂後版次</label>
            <input type="text" id="rev-new-ver" placeholder="例：V3.2">
          </div>
          <div class="rev-row">
            <label>修訂日期</label>
            <input type="date" id="rev-date">
          </div>
          <div class="rev-row">
            <label>修訂原因</label>
            <textarea id="rev-reason" rows="3" placeholder="請說明本次修訂原因…"></textarea>
          </div>
          <div class="rev-row">
            <label>修訂內容摘要</label>
            <textarea id="rev-summary" rows="3" placeholder="請說明修訂的主要內容…"></textarea>
          </div>
          <div class="rev-row">
            <label>修訂者</label>
            <input type="text" id="rev-author" placeholder="姓名">
          </div>
          <div class="rev-row">
            <label>審核者</label>
            <input type="text" id="rev-reviewer" placeholder="姓名">
          </div>
          <div class="rev-row">
            <label>核准者</label>
            <input type="text" id="rev-approver" placeholder="姓名">
          </div>
          <div id="rev-actions">
            <button id="rev-preview-btn">即時預覽</button>
            <button id="rev-word-btn">下載 Word</button>
          </div>
        </div>

        <!-- 即時預覽區 -->
        <div id="rev-preview" style="display:none">
          <div id="rev-preview-content"></div>
          <button id="rev-back-btn">&#8592; 返回編輯</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ===== 對話視窗 ===== -->
  <div id="chat-fab" title="開啟資料輸入視窗">
    <span>&#128172;</span>
  </div>

  <div id="chat-panel" role="dialog" aria-label="資料輸入視窗" aria-hidden="true">
    <div id="chat-header">
      <span>資料輸入</span>
      <button id="chat-close" aria-label="關閉">&#10005;</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <label id="chat-file-label" for="chat-file" title="上傳檔案">&#128206;</label>
      <input type="file" id="chat-file" accept=".pdf,.doc,.docx,.txt" aria-label="上傳檔案">
      <input type="text" id="chat-input" placeholder="輸入訊息或上傳檔案…" autocomplete="off">
      <button id="chat-send" aria-label="送出">送出</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
